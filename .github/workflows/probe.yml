name: probe

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record job start
        run: echo "PROBE_JOB_START=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Prepare probe-data branch
        run: |
          if git ls-remote --exit-code --heads origin probe-data >/dev/null 2>&1; then
            git clone --depth 1 --branch probe-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-data
          else
            mkdir probe-data && cd probe-data
            git init -q -b probe-data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Run probe
        continue-on-error: true
        run: uv run python -m panel_fondos.collectors.probe --out probe-data/probe.jsonl

      - name: Commit result
        if: always()
        working-directory: probe-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe.jsonl
          git commit -q -m "probe ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do
            git push origin probe-data && exit 0
            git pull --rebase -q origin probe-data
          done
          exit 1
