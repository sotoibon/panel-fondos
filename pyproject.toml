[project]
name = "panel-fondos"
version = "0.1.0"
description = "Panel personal que estima en tiempo casi real el valor de 4 fondos de MyInvestor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_fondos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
